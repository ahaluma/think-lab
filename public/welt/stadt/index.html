<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AnkaPlay Stadt</title>
    <meta name="description" content="Die AnkaPlay Stadt: Mathe für Schulkinder. Ohne Werbung, ohne Tracking." />
    <meta name="theme-color" content="#e9eef2" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=3" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="../welt.css" />
    <script type="module" src="stadt.js"></script>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <a class="icon-btn" id="home" href="/" data-t-label="allGames" aria-label="Alle Spiele"></a>
        <div class="spacer"></div>
        <button class="icon-btn sun" id="hear" type="button" data-t-label="hear" aria-label="Vorlesen"></button>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>

      <!-- The town for school children: five places along one street (TOWN in frame/ideas.js).
           A place with something to play is awake, the others sleep. The market leads to its own world. -->
      <div class="map card" id="map" aria-label="Die Stadt">
        <svg viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg">
          <rect width="360" height="400" fill="#cfeaff" />
          <circle cx="314" cy="40" r="20" fill="#ffc83a" stroke="#1b2140" stroke-width="3" />
          <rect y="300" width="360" height="100" fill="#b9e5a0" />
          <!-- the street -->
          <rect y="196" width="360" height="48" fill="#9aa5b4" stroke="#1b2140" stroke-width="3" />
          <path d="M10 220h30M70 220h30M130 220h30M190 220h30M250 220h30M310 220h30" stroke="#fff" stroke-width="4" />
          <rect y="244" width="360" height="56" fill="#d9dde6" />

          <!-- Station: the number line, order, comparing, ordinal numbers (idea "reihe") -->
          <g class="place" data-o="bahnhof" tabindex="0" role="button">
            <rect x="4" y="70" width="126" height="126" fill="transparent" />
            <rect x="12" y="110" width="88" height="86" fill="#ffd0a6" stroke="#1b2140" stroke-width="3" />
            <path d="M6 114 L56 80 L106 114Z" fill="#e8488a" stroke="#1b2140" stroke-width="3" />
            <circle cx="56" cy="102" r="9" fill="#fff" stroke="#1b2140" stroke-width="3" />
            <path d="M56 102v-5M56 102h4" stroke="#1b2140" stroke-width="2" stroke-linecap="round" />
            <rect x="24" y="146" width="22" height="50" fill="#8a5a33" stroke="#1b2140" stroke-width="3" />
            <rect x="58" y="136" width="32" height="22" fill="#cfeaff" stroke="#1b2140" stroke-width="3" />
            <g stroke="#1b2140" stroke-width="3">
              <rect x="104" y="156" width="24" height="36" rx="6" fill="#2456b8" />
              <rect x="108" y="162" width="16" height="10" fill="#cfeaff" />
            </g>
            <text class="zzz" x="80" y="92">💤</text>
          </g>

          <!-- Flower shop: tens and ones (ten flowers make a bunch, ten bunches a basket) -->
          <g class="place" data-o="blumen" tabindex="0" role="button">
            <rect x="134" y="80" width="96" height="116" fill="transparent" />
            <rect x="140" y="128" width="84" height="68" fill="#fff" stroke="#1b2140" stroke-width="3" />
            <path d="M136 128 L146 106 L218 106 L228 128Z" fill="#e8488a" stroke="#1b2140" stroke-width="3" />
            <path d="M160 106 L156 128M182 106 L182 128M204 106 L208 128" stroke="#fff" stroke-width="4" />
            <text x="146" y="168" font-size="20">💐🌷</text>
            <text x="150" y="192" font-size="16">🧺🌼</text>
            <text class="zzz" x="196" y="100">💤</text>
          </g>

          <!-- Market: calculating (its own world, welt/markt/) -->
          <g class="place" data-o="markt" tabindex="0" role="button">
            <rect x="234" y="80" width="124" height="116" fill="transparent" />
            <g stroke="#1b2140" stroke-width="3">
              <rect x="242" y="140" width="52" height="56" fill="#fff6e0" />
              <path d="M238 140 L248 112 L290 112 L298 140Z" fill="#ff5a36" />
              <rect x="300" y="150" width="52" height="46" fill="#fff6e0" />
              <path d="M296 150 L306 122 L346 122 L354 150Z" fill="#12a564" />
            </g>
            <text x="248" y="178" font-size="16">🍎🥚</text>
            <text x="306" y="184" font-size="16">🍞🧺</text>
            <text class="zzz" x="318" y="112">💤</text>
          </g>

          <!-- Workshop: shapes and solids, symmetry, measuring (idea "formen") -->
          <g class="place" data-o="werkstatt" tabindex="0" role="button">
            <rect x="10" y="250" width="160" height="140" fill="transparent" />
            <rect x="24" y="300" width="120" height="76" fill="#c79a62" stroke="#1b2140" stroke-width="3" />
            <path d="M16 304 L84 262 L152 304Z" fill="#8a5a33" stroke="#1b2140" stroke-width="3" />
            <rect x="66" y="330" width="36" height="46" fill="#6b4a2b" stroke="#1b2140" stroke-width="3" />
            <text x="34" y="330" font-size="20">📐</text>
            <text x="110" y="330" font-size="20">🔺</text>
            <text class="zzz" x="96" y="276">💤</text>
          </g>

          <!-- Weather station: clock, calendar, charts, chance (idea "zeit") -->
          <g class="place" data-o="wetter" tabindex="0" role="button">
            <rect x="190" y="250" width="164" height="140" fill="transparent" />
            <rect x="250" y="292" width="40" height="84" fill="#fff" stroke="#1b2140" stroke-width="3" />
            <path d="M270 292v-30M256 262h28" stroke="#1b2140" stroke-width="3" stroke-linecap="round" />
            <path d="M284 262l8 -6v12z" fill="#ff5a36" stroke="#1b2140" stroke-width="2" />
            <g stroke="#1b2140" stroke-width="2">
              <rect x="206" y="350" width="10" height="26" fill="#2456b8" /><rect x="220" y="336" width="10" height="40" fill="#e8488a" /><rect x="234" y="358" width="10" height="18" fill="#ffc83a" />
            </g>
            <text x="304" y="350" font-size="22">🌦️</text>
            <text class="zzz" x="300" y="300">💤</text>
          </g>

          <text class="walker pulse" id="walker" x="56" y="236" tabindex="0" role="button"></text>
        </svg>
      </div>

      <!-- A place is open: the five perspectives, each with its fixed symbol. -->
      <section class="ways-panel card" id="ways" hidden>
        <h2 id="waysTitle"></h2>
        <ul class="persp" id="persp"></ul>
      </section>

      <!-- The way to the thinking mountain (welt/berg/), for older children. -->
      <a class="mountain-door card" id="door" href="/welt/berg/">
        <span class="door-icon" aria-hidden="true">⛰️</span>
        <span class="door-text"><strong id="doorName">Zum Denk-Berg</strong><small id="doorNote"></small></span>
      </a>

      <!-- Back to the nature world, for the basic ideas. -->
      <a class="mountain-door card" id="natureDoor" href="/welt/">
        <span class="door-icon" aria-hidden="true">🌳</span>
        <span class="door-text"><strong id="natureName">Zur Natur</strong><small id="natureNote"></small></span>
      </a>

      <footer class="map-foot">
        <a href="/welt/sichern/" data-t="save">Sichern</a>
        <a href="/datenschutz/" data-t="privacy">Datenschutz</a>
      </footer>
    </main>
  </body>
</html>
