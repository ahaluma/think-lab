<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Markt · AnkaPlay</title>
    <meta name="description" content="Der Markt von AnkaPlay: Plus, Minus, Mal und Geteilt üben, bis es sitzt. Ohne Werbung, ohne Tracking." />
    <meta name="theme-color" content="#e9eef2" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=3" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="../welt.css" />
    <link rel="stylesheet" href="markt.css" />
    <script type="module" src="markt.js"></script>
  </head>
  <body data-world="markt">
    <main class="app">
      <div class="topbar">
        <a class="icon-btn" id="home" href="/welt/stadt/" data-t-label="toWorld" aria-label="Zur Stadt"></a>
        <div class="spacer"></div>
        <button class="icon-btn sun" id="hear" type="button" data-t-label="hear" aria-label="Vorlesen"></button>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>

      <!-- The market: four stands around the market square (markt.js draws the stands into #stands).
           True to the world: sky above, the square's stones below, the well in the middle. -->
      <div class="map card" id="map" aria-label="Der Markt">
        <svg viewBox="0 0 360 370" xmlns="http://www.w3.org/2000/svg" id="square">
          <rect width="360" height="370" fill="#cfeaff" />
          <circle cx="314" cy="40" r="20" fill="#ffc83a" stroke="#1b2140" stroke-width="3" />
          <g fill="#fff" stroke="#1b2140" stroke-width="3">
            <ellipse cx="60" cy="40" rx="30" ry="11" /><ellipse cx="78" cy="31" rx="18" ry="11" />
          </g>
          <!-- houses behind the market -->
          <g stroke="#1b2140" stroke-width="3">
            <rect x="96" y="44" width="52" height="56" fill="#ffd9a8" /><path d="M90 46 L122 20 L154 46Z" fill="#e8488a" />
            <rect x="150" y="56" width="62" height="44" fill="#fbfcfe" /><path d="M144 58 L181 30 L218 58Z" fill="#ff5a36" />
            <rect x="214" y="48" width="46" height="52" fill="#b8e6d0" /><path d="M208 50 L237 26 L266 50Z" fill="#2456b8" />
            <rect x="114" y="64" width="12" height="14" fill="#cfeaff" /><rect x="170" y="70" width="12" height="14" fill="#cfeaff" /><rect x="230" y="64" width="12" height="14" fill="#cfeaff" />
          </g>
          <!-- the square -->
          <path d="M0 100 H360 V370 H0Z" fill="#e3d3b8" stroke="#1b2140" stroke-width="3" />
          <g stroke="#cdb994" stroke-width="2" fill="none">
            <path d="M0 140 H360 M0 190 H360 M0 240 H360 M0 290 H360 M0 340 H360" />
            <path d="M40 100 V370 M100 100 V370 M160 100 V370 M220 100 V370 M280 100 V370 M340 100 V370" stroke-dasharray="4 46" />
          </g>
          <g id="stands"></g>
        </svg>
      </div>

      <!-- A stand is open: its four summits (number ranges), then the five perspectives of one summit. -->
      <section class="ways-panel card" id="panel" hidden>
        <h2 id="panelTitle"></h2>
        <div class="summits" id="summits"></div>
        <p class="summit-note" id="summitNote"></p>
        <ul class="persp" id="persp"></ul>
      </section>

      <footer class="map-foot">
        <a href="/welt/sichern/" data-t="save">Sichern</a>
        <a href="/datenschutz/" data-t="privacy">Datenschutz</a>
      </footer>
    </main>
  </body>
</html>
