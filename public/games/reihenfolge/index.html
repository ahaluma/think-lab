<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zuerst und dann · AnkaPlay</title>
    <meta name="theme-color" content="#e9eef2" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="game.css" />
    <!-- Load all modules at once instead of one after another (faster start on phones). -->
    <link rel="modulepreload" href="/shared/kit.js" />
    <link rel="modulepreload" href="/shared/i18n.js" />
    <link rel="modulepreload" href="/shared/store.js" />
    <link rel="modulepreload" href="/shared/progress.js" />
    <link rel="modulepreload" href="/shared/adapt.js" />
    <link rel="modulepreload" href="/shared/profiles.js" />
    <link rel="modulepreload" href="/shared/fit.js" />
    <link rel="modulepreload" href="/shared/lang/de.js" />
    <link rel="modulepreload" href="levels.js" />
    <link rel="modulepreload" href="lang/de.js" />
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <a class="icon-btn" id="home" href="/" data-t-label="home" aria-label="Zurück zur Startseite"></a>
        <div class="spacer"></div>
        <ol class="stars" id="stars" data-t-label="stars" aria-label="Sterne"></ol>
        <div class="spacer"></div>
        <button class="icon-btn sun" id="speak" type="button" data-t-label="readAgain" aria-label="Nochmal vorlesen"></button>
      </div>

      <!-- Start: one big button. The first tap also switches on sound in the browser. -->
      <section class="screen" id="start">
        <div class="start-art" aria-hidden="true">🫘🌱🌻</div>
        <button class="btn go play pulse" id="play" type="button" data-t-label="play" aria-label="Spielen"></button>
      </section>

      <!-- Play. Ordering: numbered places on top, the mixed-up pictures below.
           Picking: a picture (or the week) on top, the answers below. -->
      <section class="screen" id="round" hidden>
        <div class="order" id="order">
          <div class="slots card" id="slots" aria-hidden="true"></div>
          <div class="pool" id="pool"></div>
        </div>
        <div class="pickbox" id="pickbox" hidden>
          <div class="prompt card" id="prompt" aria-hidden="true"></div>
          <div class="week card" id="week" aria-hidden="true" hidden></div>
          <div class="choices" id="choices"></div>
        </div>
      </section>

      <!-- Done: five stars collected. -->
      <section class="screen" id="done" hidden>
        <div class="trophy pop" aria-hidden="true">🏆</div>
        <button class="btn ok play" id="again" type="button" data-t-label="playAgain" aria-label="Nochmal spielen"></button>
      </section>
    </main>
  </body>
</html>
