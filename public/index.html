<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AnkaPlay</title>
    <meta name="description" content="Kleine Zahlen- und Logikspiele für Kinder. Ohne Werbung, ohne Tracking." />
    <meta name="theme-color" content="#e9eef2" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=3" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/hub.css" />
    <!-- Load all modules at once instead of one after another (faster start on phones). -->
    <link rel="modulepreload" href="/catalog.js" />
    <link rel="modulepreload" href="/shared/kit.js" />
    <link rel="modulepreload" href="/shared/i18n.js" />
    <link rel="modulepreload" href="/shared/store.js" />
    <link rel="modulepreload" href="/shared/profiles.js" />
    <link rel="modulepreload" href="/shared/fit.js" />
    <link rel="modulepreload" href="/shared/lang/de.js" />
    <script type="module" src="/hub.js"></script>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <div class="langs" id="langs" data-t-label="language" role="group"></div>
        <div class="spacer"></div>
        <a class="icon-btn parents-btn" id="parents" href="/eltern/" data-t-label="forParents" aria-label="Für Eltern: Fortschritt"><span id="parentsIcon"></span><span class="parents-word" data-t="parents">Eltern</span></a>
      </div>
      <!-- The child playing. Tap = "Wer spielt?". -->
      <a class="icon-btn who kid-chip" id="kid" href="/?wer" hidden></a>
      <header class="hub-head">
        <img class="logo" src="/favicon.svg?v=3" alt="" width="56" height="56" />
        <h1><span>Anka</span><span class="play-word">Play</span></h1>
      </header>
      <!-- "Wer spielt?": one big tile per child. Shown when there are several children. -->
      <section class="picker" id="picker" hidden>
        <h2 data-t="whoPlays">Wer spielt?</h2>
        <ul class="kids" id="kids"></ul>
      </section>

      <!-- No children yet: the games work, progress is shared. A hint for the parents. -->
      <a class="card add-kids" id="addKids" href="/eltern/#kinder" hidden>
        <span aria-hidden="true">👧👦</span><span data-t="addKidsHint">Für Eltern: Kinder anlegen</span>
      </a>

      <div class="categories" id="categories"></div>
      <footer class="hub-foot">
        <a href="/datenschutz/" data-t="privacy">Datenschutz</a>
      </footer>
    </main>
  </body>
</html>
